services:
  qdrant:
    image: qdrant/qdrant:v1.20.0  # matches qdrant-client 1.20 (released 2026-10-21)
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  qdrant_storage:
