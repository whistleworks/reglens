name: eval-full

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"   # nightly, 03:17 UTC
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  eval:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-eval'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QDRANT_URL: path:qdrant_local
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-groups --frozen
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/fastembed
            qdrant_local
          key: index-${{ hashFiles('data/processed/chunks_units.jsonl') }}
      - name: Build index (cached between runs)
        run: test -d qdrant_local/collection || make index STRATEGY=units ENRICH=hierarchy
      - name: Retrieval eval on dev
        run: make eval SPLIT=dev CONFIG=configs/exp_units_norec_w05.yaml
      - name: End-to-end eval on dev (agent + judge)
        if: env.GROQ_API_KEY != ''
        run: make eval SPLIT=dev STAGE=e2e CONFIG=configs/e2e_hybrid.yaml
      - name: Report
        run: |
          uv run python -m evals.report $(ls -t evals/results/*_dev.json | head -1) > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: evals/results/
      - name: Comment on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file report.md
