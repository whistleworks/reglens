[project]
name = "reglens"
version = "0.1.0"
description = "Agentic RAG over the EU AI Act and GDPR with verifiable citations, evaluated, observable, deployed."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.27",
    "tenacity>=9.0",
    "lxml>=5.3",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
    "lxml-stubs>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reglens"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "T20", "N", "PT", "RET", "ARG"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Italian text and typographic quotes are legitimate

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["reglens"]

[[tool.mypy.overrides]]
module = ["fastembed.*", "qdrant_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers -m 'not llm and not integration and not data and not network'"
markers = [
    "llm: calls a real LLM provider (excluded by default)",
    "integration: needs a running Qdrant (excluded by default, run with make test-integration)",
    "data: needs the real ingested corpus in data/ (run with make test-data)",
    "network: needs internet access (excluded by default)",
]

[tool.coverage.run]
source = ["src/reglens", "evals/metrics"]
branch = true
